<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="description" content="Panel informativo para coche: ubicación, carretera, meteo y POIs cercanos en tiempo real.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <title>Panel de viaje</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0f1117;
      color: #fff;
      font-family: -apple-system, system-ui, sans-serif;
    }

    /* Visor: contenedor de las tres vistas con swipe horizontal.
       --app-height lo setea JS con window.innerHeight en cada resize/
       orientationchange/visibilitychange. Chrome Mobile no siempre
       actualiza 100dvh cuando la barra del navegador aparece/desaparece
       durante el swipe, y el layout queda cortado al volver a la vista
       principal (BPC-12). La variable JS garantiza recálculo fiable. */
    .visor {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      scrollbar-width: none;
    }
    .visor::-webkit-scrollbar { display: none; }

    /* Cada vista ocupa la pantalla completa. scroll-snap-stop: always
       evita que el swipe pare a medias entre dos vistas. */
    .vista {
      scroll-snap-align: start;
      scroll-snap-stop: always;
      min-width: 100vw;
      height: 100vh;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      flex-shrink: 0;
      overflow: hidden;
    }

    /* BPC-13: safe-area del navegador (iconos de estado, punch-hole, esquinas
       redondeadas). La variable --safe-extra se añade para desarrollo
       (parámetro ?safearea=N simula el inset cuando probamos en escritorio).
       viewport-fit=cover en el meta permite que env() devuelva valores reales.
       Se suman a los paddings normales de cada vista en los lados sensibles. */
    :root {
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-right:  env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left:   env(safe-area-inset-left, 0px);
      --safe-extra:  0px;
    }

    /* Vista 1: grid 2 columnas compacto para 640×360 */
    #vista1 {
      display: grid;
      grid-template-columns: 58% 42%;
      grid-template-rows: 22px 1fr auto auto;
      grid-template-areas:
        "estado estado"
        "izq    der"
        "poi    poi"
        "gas    gas";
      padding:
        calc(10px + var(--safe-top))
        calc(12px + var(--safe-right) + var(--safe-extra))
        calc(8px + var(--safe-bottom))
        calc(12px + var(--safe-left));
      column-gap: 10px;
      overflow: hidden;
    }

    .v1-estado { grid-area: estado; display: flex; align-items: center; }
    .v1-velocidad { font-size: 20px; font-weight: 700; margin-left: auto; }

    .v1-izq {
      grid-area: izq;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 4px;
      min-height: 0;
    }

    .v1-der {
      grid-area: der;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 4px;
      padding-left: 10px;
      border-left: 1px solid rgba(255,255,255,0.1);
      min-height: 0;
    }

    .v1-poi {
      grid-area: poi;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 5px;
    }

    /* FN-09: barra compacta de gasolineras al pie de V1. Siempre visible
       aunque no haya datos aún (oculta solo cuando no hay ninguna). */
    .v1-gasolineras {
      grid-area: gas;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 4px;
      margin-top: 4px;
      display: flex;
      flex-wrap: nowrap;
      gap: 14px;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
    }
    .v1-gasolineras .v1-gasolinera {
      display: flex;
      gap: 4px;
      align-items: baseline;
    }
    .v1-gasolineras .v1-gasolinera-marca { font-weight: 600; }
    .v1-gasolineras .v1-gasolinera-dist { opacity: 0.55; }

    /* Compactar elementos para Vista 1 */
    #vista1 .estado { font-size: 12px; margin: 0; line-height: 1.2; }
    #vista1 .carretera { margin-bottom: 3px; min-height: auto; }
    #vista1 .salida { margin-bottom: 3px; }
    #vista1 .salida-num { font-size: 18px; }
    #vista1 .ubicacion { margin: 0; padding: 0; border: none; }
    #vista1 .municipio { font-size: 20px; }
    #vista1 .admin { font-size: 12px; }
    #vista1 .datos-municipio { font-size: 11px; margin-top: 1px; }
    #vista1 .municipio-info { display: none; }
    #vista1 .meteo { margin: 0; padding: 0; border: none; }
    #vista1 .meteo .temp { font-size: 20px; margin-bottom: 2px; }
    #vista1 .meteo .descripcion { font-size: 13px; margin-bottom: 2px; }
    #vista1 .meteo .descripcion .icono { width: 16px; height: 16px; }
    #vista1 .meteo .sub { font-size: 11px; }
    #vista1 .meteo .prevision { font-size: 11px; margin-top: 4px; padding-top: 4px; }

    /* POI compacto en Vista 1: chips sin iconos */
    #vista1 .poi-seccion { margin: 0; padding: 0; border: none; }
    #vista1 .poi-scroll { display: flex; flex-wrap: wrap; gap: 2px 10px; overflow: hidden; }
    #vista1 .poi-pueblo {
      min-width: auto; background: none; padding: 0;
      display: flex; align-items: baseline; gap: 3px; flex-shrink: 0;
    }
    #vista1 .poi-pueblo-cab { margin-bottom: 0; }
    #vista1 .poi-pueblo-nombre { font-size: 12px; white-space: nowrap; }
    #vista1 .poi-pueblo-dist { font-size: 11px; }
    #vista1 .poi-item { display: none; }

    .estado {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 16px;
    }

    .estado.error  { color: #ff5555; opacity: 1; }
    .estado.ok     { color: #66ff99; opacity: 1; }
    .estado.aviso  { color: #ffaa44; opacity: 1; }

    .carretera {
      margin-bottom: 16px;
      min-height: 28px;
    }

    .carretera .pastilla {
      display: inline-block;
      background: #1e5fb8;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      padding: 6px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* Variante granate para carreteras autonómicas y locales (M-505, CL-601,
       CV-50, GI-632, A-92 andaluza, etc.). Decisión 19, sesión 9.6. */
    .carretera .pastilla.autonomica {
      background: #7a1f2b;
    }

    /* IU-09: botón de pantalla completa en la esquina superior derecha de V1.
       Discreto, visible solo cuando no estamos ya en fullscreen. Al tocarlo
       invoca la Fullscreen API (estándar; Chrome Android ≥ 71). */
    #btnFullscreen {
      position: absolute;
      top: calc(4px + var(--safe-top));
      right: calc(6px + var(--safe-right) + var(--safe-extra));
      width: 26px; height: 26px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 5px;
      color: #fff;
      opacity: 0.55;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 20;
    }
    #btnFullscreen:active { opacity: 0.9; }
    body.fullscreen-activo #btnFullscreen { display: none; }
    #btnFullscreen svg { width: 14px; height: 14px; }

    /* FN-06: chip con velocidad límite junto a la pastilla. Estilo
       reminiscente de señal redonda blanca con borde rojo. */
    .maxspeed-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-weight: 800;
      font-size: 13px;
      border: 2.5px solid #c0392b;
      margin-left: 8px;
      vertical-align: middle;
      line-height: 1;
    }
    .v3-carretera .maxspeed-chip {
      width: 22px; height: 22px;
      font-size: 11px;
      border-width: 2px;
      margin-left: 6px;
    }
    /* Velocidad GPS coloreada según relación con maxspeedActual.
       Aplicada a #v1Velocidad y #v2Velocidad. */
    .v1-velocidad.exceso, .v2-velocidad.exceso { color: #ffaa44; }
    .v1-velocidad.exceso-grave, .v2-velocidad.exceso-grave { color: #ff5555; }

    /* FN-08: cuando se supera el límite, el chip de velocidad se invierte
       (fondo rojo sólido, texto blanco) para alertar sin distraer. Sin barra
       diagonal: es una alerta del panel, no una señal real. */
    .maxspeed-chip.exceso {
      background: #c0392b;
      color: #fff;
      border-color: #fff;
    }

    .carretera .calle {
      font-size: 15px;
      opacity: 0.7;
    }

    .carretera .sin-carretera {
      font-size: 13px;
      opacity: 0.4;
      font-style: italic;
    }

    .ubicacion {
      margin-bottom: 20px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .ubicacion .label {
      font-size: 11px;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .ubicacion .municipio {
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 2px;
    }

    .ubicacion .admin {
      font-size: 14px;
      opacity: 0.6;
    }

    /* ---- Bloque meteo ---- */
    .meteo {
      margin-bottom: 20px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .meteo .label {
      font-size: 11px;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .meteo .temp {
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 4px;
    }

    .meteo .descripcion {
      font-size: 16px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meteo .descripcion .icono {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .meteo .descripcion .texto {
      opacity: 0.85;
    }

    .meteo .sub {
      font-size: 13px;
      opacity: 0.6;
      line-height: 1.6;
    }

    .meteo .sub.error { color: #ff5555; opacity: 1; }

    .meteo .prevision {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.08);
      font-size: 13px;
      opacity: 0.75;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meteo .prevision svg,
    .meteo .descripcion svg {
      width: 1em;
      height: 1em;
      vertical-align: -0.1em;
    }
    /* ---- Fin bloque meteo ---- */

    .coordenadas {
      font-size: 16px;
      opacity: 0.6;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .coordenadas b { opacity: 0.9; font-weight: 400; }

    .detalles {
      font-size: 13px;
      opacity: 0.6;
      line-height: 1.8;
    }

    .detalles span { opacity: 0.6; }

    /* ---- Bloque próxima salida ---- */
    .salida {
      margin-bottom: 16px;
      display: none;        /* oculto por defecto; JS lo muestra */
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .salida.visible { display: flex; }

    .salida-pastilla {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: #1a7a35;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .salida-fila {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .salida-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0.8;
      text-transform: uppercase;
    }

    .salida-num {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .salida-dist {
      font-size: 15px;
      opacity: 0.85;
    }

    .salida-sig {
      font-size: 13px;
      opacity: 0.45;
    }

    .salida-destinos {
      font-size: 12px;
      opacity: 0.9;
      letter-spacing: 0.3px;
      display: none;
    }

    .salida-destinos.visible {
      display: block;
    }
    /* ---- Fin bloque próxima salida ---- */

    /* ---- Bloque POI: Qué ver por la zona ---- */
    .poi-seccion {
      margin-bottom: 20px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    /* Fila de tarjetas deslizable horizontalmente */
    .poi-scroll {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .poi-scroll::-webkit-scrollbar { display: none; }

    .poi-cargando {
      padding: 8px 12px;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      font-style: italic;
    }

    .poi-pueblo {
      min-width: 175px;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 10px;
      flex-shrink: 0;
    }

    .poi-pueblo-cab {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 8px;
    }

    .poi-pueblo-nombre {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
    }

    .poi-pueblo-dist {
      font-size: 11px;
      opacity: 0.45;
      flex-shrink: 0;
    }

    .poi-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .poi-foto {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .poi-icono-box {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .poi-nombre {
      font-size: 12px;
      opacity: 0.85;
      line-height: 1.35;
    }

    .poi-nombre-sec {
      font-size: 11px;
      opacity: 0.5;
    }
    /* ---- Fin bloque POI ---- */

    /* Datos del municipio (población, altitud) bajo la línea admin */
    .datos-municipio {
      font-size: 12px;
      opacity: 0.4;
      margin-top: 2px;
      line-height: 1.5;
    }

    /* Descripción + foto del municipio */
    .municipio-info {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 6px;
    }
    .municipio-info img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .municipio-info .municipio-desc {
      font-size: 12px;
      opacity: 0.55;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* ---- Vista 2: Ubicación + Meteo glanceable ---- */
    #vista2 {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        calc(16px + var(--safe-top))
        calc(20px + var(--safe-right) + var(--safe-extra))
        calc(16px + var(--safe-bottom))
        calc(20px + var(--safe-left));
      position: relative;
      transition: background 1.5s ease;
    }

    /* Gradientes por categoría meteo */
    #vista2[data-meteo-cat="despejado"] { background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #0f2035 100%); }
    #vista2[data-meteo-cat="nublado"]   { background: linear-gradient(135deg, #1a1d24 0%, #2e3440 50%, #1a1d24 100%); }
    #vista2[data-meteo-cat="niebla"]    { background: linear-gradient(135deg, #1c1f26 0%, #3a3d44 50%, #28292e 100%); }
    #vista2[data-meteo-cat="lluvia"]    { background: linear-gradient(135deg, #0d1520 0%, #1a2a3e 50%, #0f1925 100%); }
    #vista2[data-meteo-cat="nieve"]     { background: linear-gradient(135deg, #1a1e2e 0%, #2a3048 50%, #1e2236 100%); }
    #vista2[data-meteo-cat="tormenta"]  { background: linear-gradient(135deg, #0f0a18 0%, #261830 50%, #140e1e 100%); }

    /* IU-10: capa de animación sutil detrás del contenido. Solo transform y
       opacity (no repintado), duraciones >= 30 s, opacidad baja para no
       distraer. Primera entrega: despejado, nublado, lluvia. */
    .v2-animacion {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    /* IU-12: paleta del cielo por momento del día. Estas variables las
       consumen la luminaria, los god-rays y la iluminación ambiental.
       Valores diseñados con mix-blend-mode:screen en mente (no saturar). */
    #vista2 {
      --v2-disco-centro:  #fff3c8;
      --v2-disco-borde:   #ffb64d;
      --v2-halo-color:    rgba(255, 200, 120, 0.35);
      --v2-halo-color-2:  rgba(255, 170, 80, 0.18);
      --v2-rays-color:    rgba(255, 205, 130, 0.28);
      --v2-ambient-color: rgba(255, 200, 130, 0.22);
      --v2-star-alpha:    0;
      --v2-luna-relieve:  0;
    }
    #vista2[data-momento="amanecer"] {
      --v2-disco-centro:  #ffe4b5;
      --v2-disco-borde:   #ff7a4d;
      --v2-halo-color:    rgba(255, 140, 100, 0.40);
      --v2-halo-color-2:  rgba(255, 90, 120, 0.20);
      --v2-rays-color:    rgba(255, 150, 110, 0.32);
      --v2-ambient-color: rgba(255, 130, 120, 0.28);
    }
    #vista2[data-momento="atardecer"] {
      --v2-disco-centro:  #ffd390;
      --v2-disco-borde:   #e84a5c;
      --v2-halo-color:    rgba(240, 100, 120, 0.38);
      --v2-halo-color-2:  rgba(190, 70, 150, 0.22);
      --v2-rays-color:    rgba(255, 130, 140, 0.30);
      --v2-ambient-color: rgba(230, 110, 140, 0.28);
    }
    #vista2[data-momento="noche"] {
      --v2-disco-centro:  #e8ecf4;
      --v2-disco-borde:   #aab4cc;
      --v2-halo-color:    rgba(170, 195, 240, 0.28);
      --v2-halo-color-2:  rgba(120, 150, 220, 0.14);
      --v2-rays-color:    rgba(170, 200, 245, 0.16);
      --v2-ambient-color: rgba(130, 160, 230, 0.16);
      --v2-star-alpha:    0.7;
      --v2-luna-relieve:  0.35;
    }

    /* IU-12: luminaria celeste (sol o luna según momento). Grande (360px),
       posicionada 60% fuera de pantalla esquina superior-derecha. */
    .v2-luminaria {
      position: absolute;
      top: -210px;
      right: -180px;
      width: 360px;
      height: 360px;
      display: none;
      pointer-events: none;
    }
    #vista2[data-meteo-cat="despejado"] .v2-luminaria { display: block; }
    .v2-lum-halo {
      position: absolute;
      inset: -30%;
      border-radius: 50%;
      background: radial-gradient(circle at center,
        var(--v2-halo-color) 0%,
        var(--v2-halo-color-2) 35%,
        transparent 70%);
      filter: blur(18px);
    }
    .v2-lum-disco {
      position: absolute;
      inset: 20%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%,
        var(--v2-disco-centro) 0%,
        var(--v2-disco-borde) 70%,
        var(--v2-disco-borde) 100%);
      filter: blur(1.5px);
      opacity: 0.95;
    }
    /* Relieve lunar: cráteres suaves visibles solo de noche (var --v2-luna-relieve=0.35). */
    .v2-lum-disco::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: var(--v2-luna-relieve, 0);
      background:
        radial-gradient(circle at 58% 38%, rgba(120,130,150,0.45) 0%, transparent 14%),
        radial-gradient(circle at 42% 62%, rgba(110,120,145,0.40) 0%, transparent 10%),
        radial-gradient(circle at 70% 70%, rgba(115,125,150,0.35) 0%, transparent 8%);
    }

    /* IU-12: iluminación ambiental. Radial gigante que baña la pantalla
       desde la esquina de la luminaria. mix-blend-mode:screen suma luz
       sobre el gradiente de fondo existente. */
    .v2-ambient {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 140% 100% at 95% -5%,
        var(--v2-ambient-color) 0%,
        transparent 55%);
      mix-blend-mode: screen;
      pointer-events: none;
    }
    #vista2[data-meteo-cat="despejado"] .v2-ambient,
    #vista2[data-meteo-cat="nublado"]   .v2-ambient { display: block; }
    .v2-ambient { display: none; }

    /* IU-12: god-rays. 5 haces saliendo de la esquina superior-derecha
       con mix-blend-mode:screen. Cada uno tiene su propia duración larga
       (28-48s) y delay para que aparezcan desfasados. */
    .v2-rays {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      transform-origin: 100% 0%;
      mix-blend-mode: screen;
      pointer-events: none;
      display: none;
    }
    #vista2[data-meteo-cat="despejado"] .v2-rays { display: block; }
    .v2-ray {
      position: absolute;
      top: 0;
      right: 0;
      width: 200%;
      height: 38px;
      background: linear-gradient(90deg, transparent 0%, var(--v2-rays-color) 55%, transparent 100%);
      transform-origin: 100% 50%;
      filter: blur(6px);
      opacity: 0;
      animation: v2-ray-pulso 36s ease-in-out infinite;
    }
    .v2-ray-1 { transform: rotate(200deg); animation-duration: 28s; animation-delay:  -2s; }
    .v2-ray-2 { transform: rotate(215deg); animation-duration: 34s; animation-delay:  -9s; }
    .v2-ray-3 { transform: rotate(230deg); animation-duration: 42s; animation-delay: -15s; }
    .v2-ray-4 { transform: rotate(245deg); animation-duration: 38s; animation-delay: -22s; }
    .v2-ray-5 { transform: rotate(260deg); animation-duration: 48s; animation-delay: -31s; }
    @keyframes v2-ray-pulso {
      0%, 100% { opacity: 0; }
      45%      { opacity: 0.35; }
      55%      { opacity: 0.4;  }
    }

    /* IU-12: estrellas para noche despejada. Visibles solo si --v2-star-alpha > 0. */
    .v2-estrella {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #e6edf8;
      opacity: calc(var(--v2-star-alpha, 0) * 0.9);
      box-shadow: 0 0 3px rgba(230,237,248,0.6);
      animation: v2-estrella-twinkle 8s ease-in-out infinite;
    }
    @keyframes v2-estrella-twinkle {
      0%, 100% { opacity: calc(var(--v2-star-alpha, 0) * 0.3); transform: scale(0.8); }
      50%      { opacity: calc(var(--v2-star-alpha, 0) * 1.0); transform: scale(1.1); }
    }

    /* IU-12: cuando V2 no está visible en el viewport, detenemos TODAS las
       animaciones para ahorrar batería. La clase la añade IntersectionObserver. */
    #vista2.v2-inactiva * {
      animation-play-state: paused !important;
    }
    #vista2 > *:not(.v2-animacion):not(.v2-luminaria):not(.v2-ambient):not(.v2-rays):not(.v2-rain-canvas):not(.v2-snow-canvas):not(.v2-fog):not(.v2-lightning):not(.v2-lightning-eco) { position: relative; z-index: 1; }
    .v2-anim { display: none; position: absolute; inset: 0; }
    #vista2[data-meteo-cat="despejado"] .v2-anim-despejado { display: block; }
    #vista2[data-meteo-cat="nublado"]   .v2-anim-nublado   { display: block; }
    #vista2[data-meteo-cat="niebla"].v2-fog-fallback .v2-anim-niebla { display: block; }

    /* Sol (despejado): gira lento, rayos pulsan. */
    .v2-sol {
      position: absolute;
      top: 12%;
      right: 10%;
      width: 120px;
      height: 120px;
      opacity: 0.12;
      color: #ffd37a;
      animation: v2-sol-rotar 60s linear infinite;
    }
    @keyframes v2-sol-rotar { to { transform: rotate(360deg); } }

    /* Nubes (nublado): 2 nubes con desplazamiento horizontal lento. */
    .v2-nube {
      position: absolute;
      width: 180px;
      height: 60px;
      opacity: 0.10;
      color: #cfd4dc;
      will-change: transform;
    }
    .v2-nube-1 { top: 18%; animation: v2-nube-cruza 95s linear infinite; }
    .v2-nube-2 { top: 55%; animation: v2-nube-cruza 140s linear infinite; animation-delay: -40s; opacity: 0.07; }
    @keyframes v2-nube-cruza {
      from { transform: translateX(-220px); }
      to   { transform: translateX(calc(100vw + 220px)); }
    }

    /* IU-13: lluvia servida por js/v2_rainfx.js (canvas 2D). El canvas
       se inserta como primer hijo de #vista2 y se controla via CSS con
       el selector .v2-rain-canvas más abajo. */
    .v2-rain-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 0;
    }
    #vista2[data-meteo-cat="lluvia"]   .v2-rain-canvas,
    #vista2[data-meteo-cat="tormenta"] .v2-rain-canvas { display: block; }

    /* IU-15: nieve servida por js/v2_snowfx.js (Canvas 2D) y niebla por
       js/v2_fogfx.js (SVG feTurbulence+feDisplacementMap). Las reglas
       siguientes solo aplican al fallback CSS de la niebla, activado por
       #vista2.v2-fog-fallback cuando el navegador no soporta el filter
       SVG o el usuario pasa ?fogfallback=1. Las dos capas radiales son
       las originales de IU-11. */
    .v2-snow-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 0;
    }
    #vista2[data-meteo-cat="nieve"] .v2-snow-canvas { display: block; }

    .v2-fog {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
      mix-blend-mode: screen;
      z-index: 0;
    }
    #vista2[data-meteo-cat="niebla"]:not(.v2-fog-fallback) .v2-fog { display: block; }
    .v2-fog-capa-1 { animation: v2-fog-drift-1 60s ease-in-out infinite alternate; }
    .v2-fog-capa-2 { animation: v2-fog-drift-2 80s ease-in-out infinite alternate; }
    @keyframes v2-fog-drift-1 {
      from { transform: translate(-40px, -20px); }
      to   { transform: translate( 40px,  10px); }
    }
    @keyframes v2-fog-drift-2 {
      from { transform: translate( 30px,  15px); }
      to   { transform: translate(-30px, -10px); }
    }

    /* Fallback CSS: dos radiales con pulso (comportamiento IU-11). */
    .v2-niebla-capa {
      position: absolute;
      inset: -10%;
      background: radial-gradient(ellipse at center, rgba(200,206,216,0.18) 0%, rgba(200,206,216,0) 70%);
      animation: v2-niebla-pulsa 22s ease-in-out infinite;
    }
    .v2-niebla-capa-2 {
      animation-duration: 32s;
      animation-delay: -8s;
      background: radial-gradient(ellipse at 30% 60%, rgba(180,188,200,0.14) 0%, rgba(180,188,200,0) 65%);
    }
    @keyframes v2-niebla-pulsa {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1;   }
    }

    /* IU-14: rayo SVG (rama bifurcada con glow) y eco cálido servidos por
       js/v2_lightningfx.js. El SVG ocupa toda V2; el eco es un overlay
       con gradiente radial cálido controlado por JS. */
    .v2-lightning {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
      z-index: 0;
    }
    .v2-lightning-eco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      display: none;
      z-index: 0;
    }
    #vista2[data-meteo-cat="tormenta"] .v2-lightning,
    #vista2[data-meteo-cat="tormenta"] .v2-lightning-eco { display: block; }

    @media (prefers-reduced-motion: reduce) {
      .v2-sol, .v2-nube,
      .v2-niebla-capa, .v2-fog-capa-1, .v2-fog-capa-2,
      .v2-lightning, .v2-lightning-eco { animation: none !important; display: none !important; }
    }

    .v2-ubicacion { text-align: center; margin-bottom: 16px; }
    .v2-municipio { font-size: 28px; font-weight: 400; }
    .v2-admin     { font-size: 14px; opacity: 0.55; margin-top: 2px; }

    .v2-meteo { text-align: center; }
    .v2-temp-fila {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .v2-icono { width: 40px; height: 40px; flex-shrink: 0; }
    .v2-icono svg { width: 100%; height: 100%; }
    .v2-temp  { font-size: 36px; font-weight: 300; }
    .v2-desc  { font-size: 16px; opacity: 0.85; margin-bottom: 8px; }
    .v2-sub-fila {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      opacity: 0.6;
      margin-bottom: 4px;
    }
    .v2-sub-sep { opacity: 0.4; }
    .v2-prevision {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 6px;
    }
    .v2-prevision svg {
      width: 1em;
      height: 1em;
      vertical-align: -0.1em;
    }

    .v2-velocidad {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 18px;
      opacity: 0.7;
    }
    /* ---- Fin Vista 2 ---- */

    /* ---- Vista 3: POIs grid a pantalla completa ---- */
    #vista3 {
      display: flex;
      flex-direction: column;
      padding:
        calc(8px + var(--safe-top))
        calc(10px + var(--safe-right) + var(--safe-extra))
        calc(8px + var(--safe-bottom))
        calc(10px + var(--safe-left));
      overflow: hidden;
    }

    .v3-cabecera {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .v3-carretera { font-size: 13px; font-weight: 700; }
    .v3-carretera .pastilla {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1e5fb8;
      color: #fff;
      font-weight: 700;
    }
    .v3-carretera .pastilla.autonomica { background: #7a1f2b; }
    .v3-ubicacion {
      font-size: 13px;
      opacity: 0.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .v3-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .v3-grid::-webkit-scrollbar { display: none; }
    .v3-grid { scrollbar-width: none; }

    /* FN-01: bloque de gasolineras cercanas en V3, debajo del grid de POIs */
    .v3-gasolineras {
      flex-shrink: 0;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
    }
    .v3-gasolineras-titulo {
      font-size: 11px;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .v3-gasolineras-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
    }
    .v3-gasolinera {
      display: flex;
      gap: 4px;
      align-items: baseline;
    }
    .v3-gasolinera-marca { font-weight: 600; }
    .v3-gasolinera-dist { opacity: 0.55; font-size: 11px; }

    .v3-pueblo {
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .v3-pueblo-cab {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 6px;
    }

    .v3-pueblo-nombre {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
    }

    .v3-pueblo-dist {
      font-size: 11px;
      opacity: 0.45;
      flex-shrink: 0;
    }

    .v3-poi {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .v3-poi-icono { font-size: 14px; flex-shrink: 0; }
    .v3-poi-nombre {
      font-size: 11px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* ---- Fin Vista 3 ---- */

    /* Datos GPS: ocultos por defecto, overlay fijo con ?debug=1 */
    #v1-gps { display: none; }
    body.debug-activo #v1-gps {
      display: block;
      position: fixed;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.85);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      opacity: 0.8;
      z-index: 9998;
    }
  </style>
</head>

<!-- Sprite SVG meteo: 8 símbolos, ~3 KB. IU-06. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Sol -->
  <symbol id="meteo-sol" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="5" fill="#fbbf24" />
    <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="1" x2="12" y2="4"/>
      <line x1="12" y1="20" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
      <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="4" y2="12"/>
      <line x1="20" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
      <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
    </g>
  </symbol>
  <!-- Luna -->
  <symbol id="meteo-luna" viewBox="0 0 24 24">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#94a3b8"/>
  </symbol>
  <!-- Nube -->
  <symbol id="meteo-nube" viewBox="0 0 24 24">
    <path d="M6.5 19a4.5 4.5 0 0 1-.42-8.98A7 7 0 0 1 19 10.5 3.5 3.5 0 0 1 18.5 17H6.5z" fill="#94a3b8" opacity="0.85"/>
  </symbol>
  <!-- Sol+nube (parcialmente nublado día) -->
  <symbol id="meteo-sol-nube" viewBox="0 0 24 24">
    <circle cx="10" cy="7" r="3.5" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round">
      <line x1="10" y1="1" x2="10" y2="2.5"/>
      <line x1="4.4" y1="3.4" x2="5.5" y2="4.5"/>
      <line x1="2" y1="7" x2="3.5" y2="7"/>
      <line x1="15.6" y1="3.4" x2="14.5" y2="4.5"/>
      <line x1="18" y1="7" x2="16.5" y2="7"/>
    </g>
    <path d="M6.5 20a4 4 0 0 1-.37-7.98A6 6 0 0 1 18 13.5 3 3 0 0 1 17.5 19H6.5z" fill="#94a3b8" opacity="0.85"/>
  </symbol>
  <!-- Niebla -->
  <symbol id="meteo-niebla" viewBox="0 0 24 24">
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="3" y1="8" x2="21" y2="8"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
      <line x1="3" y1="16" x2="21" y2="16"/>
    </g>
  </symbol>
  <!-- Lluvia -->
  <symbol id="meteo-lluvia" viewBox="0 0 24 24">
    <path d="M6.5 14a4 4 0 0 1-.37-7.98A6 6 0 0 1 18 8.5 3 3 0 0 1 17.5 14H6.5z" fill="#64748b"/>
    <g stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round">
      <line x1="8" y1="17" x2="7" y2="20"/>
      <line x1="12" y1="17" x2="11" y2="20"/>
      <line x1="16" y1="17" x2="15" y2="20"/>
    </g>
  </symbol>
  <!-- Nieve -->
  <symbol id="meteo-nieve" viewBox="0 0 24 24">
    <path d="M6.5 14a4 4 0 0 1-.37-7.98A6 6 0 0 1 18 8.5 3 3 0 0 1 17.5 14H6.5z" fill="#64748b"/>
    <g fill="#e2e8f0">
      <circle cx="8" cy="17.5" r="1.2"/>
      <circle cx="12" cy="19" r="1.2"/>
      <circle cx="16" cy="17.5" r="1.2"/>
    </g>
  </symbol>
  <!-- Tormenta -->
  <symbol id="meteo-tormenta" viewBox="0 0 24 24">
    <path d="M6.5 13a4 4 0 0 1-.37-7.98A6 6 0 0 1 18 7.5 3 3 0 0 1 17.5 13H6.5z" fill="#475569"/>
    <polygon points="13,14 10,19 12,19 11,23 16,17 13.5,17 15,14" fill="#facc15"/>
  </symbol>
  <!-- Desconocido -->
  <symbol id="meteo-desconocido" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="16" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">?</text>
  </symbol>
</svg>

<!-- Vista de administración de logs (?logs=1). Oculta por defecto. -->

  <section class="vista" id="vista2" data-meteo-cat="despejado">
    <!-- IU-10+IU-12: capa de animación por código WMO y momento del día. -->
    <!-- IU-12: iluminación ambiental baja la luz cálida/fría sobre la V2. -->
    <div class="v2-ambient" aria-hidden="true"></div>
    <!-- IU-12: god-rays desde la esquina superior-derecha. -->
    <div class="v2-rays" aria-hidden="true">
      <div class="v2-ray v2-ray-1"></div>
      <div class="v2-ray v2-ray-2"></div>
      <div class="v2-ray v2-ray-3"></div>
      <div class="v2-ray v2-ray-4"></div>
      <div class="v2-ray v2-ray-5"></div>
    </div>
    <!-- IU-12: luminaria celeste (sol o luna según data-momento). -->
    <div class="v2-luminaria" aria-hidden="true">
      <div class="v2-lum-halo"></div>
      <div class="v2-lum-disco"></div>
    </div>
    <!-- IU-12: contenedor de estrellas (visibles de noche despejada). -->
    <div class="v2-animacion" aria-hidden="true">
      <div class="v2-anim v2-anim-despejado" id="v2Estrellas">
        <!-- SVG de rayos del sol eliminado: sustituido por god-rays realistas. -->
      </div>
      <div class="v2-anim v2-anim-nublado">
        <svg class="v2-nube v2-nube-1" viewBox="0 0 180 60" fill="currentColor">
          <ellipse cx="40"  cy="38" rx="34" ry="18"/>
          <ellipse cx="90"  cy="30" rx="42" ry="22"/>
          <ellipse cx="140" cy="38" rx="34" ry="18"/>
        </svg>
        <svg class="v2-nube v2-nube-2" viewBox="0 0 180 60" fill="currentColor">
          <ellipse cx="40"  cy="38" rx="34" ry="18"/>
          <ellipse cx="90"  cy="30" rx="42" ry="22"/>
          <ellipse cx="140" cy="38" rx="34" ry="18"/>
        </svg>
      </div>
      <div class="v2-anim v2-anim-niebla">
        <div class="v2-niebla-capa"></div>
        <div class="v2-niebla-capa v2-niebla-capa-2"></div>
      </div>
    </div>
    <div class="v2-ubicacion">
      <div id="v2Municipio" class="v2-municipio">—</div>
      <div id="v2Admin" class="v2-admin">—</div>
    </div>
    <div class="v2-meteo">
      <div class="v2-temp-fila">
        <span id="v2MeteoIcono" class="v2-icono">—</span>
        <span id="v2MeteoTemp" class="v2-temp">—</span>
      </div>
      <div id="v2MeteoDesc" class="v2-desc">—</div>
      <div class="v2-sub-fila">
        <span id="v2MeteoViento" class="v2-sub">—</span>
        <span class="v2-sub-sep">·</span>
        <span id="v2MeteoHumedad" class="v2-sub">—</span>
      </div>
      <div id="v2MeteoPrevision" class="v2-prevision">—</div>
    </div>
    <div id="v2Velocidad" class="v2-velocidad"></div>
  </section>

  <section class="vista" id="vista3">
    <div class="v3-cabecera">
      <span id="v3Carretera" class="v3-carretera"></span>
      <span id="v3Ubicacion" class="v3-ubicacion">—</span>
    </div>
    <div id="v3Grid" class="v3-grid"></div>
    <div id="v3Gasolineras" class="v3-gasolineras" style="display:none">
      <div class="v3-gasolineras-titulo">Gasolineras cerca</div>
      <div id="v3GasolinerasLista" class="v3-gasolineras-lista"></div>
    </div>
  </section>
